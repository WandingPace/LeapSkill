h4,

.form-select:not(:disabled):hover {

}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;body&gt;
&lt;div id=&quot;skill-flow-map&quot;&gt;
  &lt;style&gt;
    #skill-flow-map {

      top: 0;

      overflow: visible;
      z-index: 0;
      display: block;

      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
      z-index: 5;
      display: block;
    }

    #skill-flow-map .flow-edge {
      stroke: var(--primary);
      stroke-opacity: 0.9;
      stroke-width: 2;

    #skill-flow-map .flow-edge-label {

  &lt;script&gt;
    const stages = [
      { id: &#x27;clarify&#x27;, label: &#x27;需求澄清 requirements&#x27; },
      { id: &#x27;specify&#x27;, label: &#x27;规格拆解 specification&#x27; },
      { id: &#x27;architect&#x27;, label: &#x27;架构设计 architecture&#x27; },
      { id: &#x27;build&#x27;, label: &#x27;实现开发 implementation&#x27; },
      { id: &#x27;verify&#x27;, label: &#x27;验证修复 verification&#x27; },
      { id: &#x27;operate&#x27;, label: &#x27;工程支撑 support&#x27; },
      { id: &#x27;reflect&#x27;, label: &#x27;知识沉淀 learning&#x27; }
    ];

    const skills = [
      { id: &#x27;grill-me&#x27;, stage: &#x27;clarify&#x27;, use: &#x27;你给它一个想法，它不断追问你，直到这个想法真的想清楚为止。&#x27;, connections: [&#x27;grilling&#x27;, &#x27;to-spec&#x27;] },
      { id: &#x27;grilling&#x27;, stage: &#x27;clarify&#x27;, use: &#x27;像面试官一样连续挑刺，把你没想清楚的地方全部问出来。&#x27;, connections: [&#x27;to-spec&#x27;] },
      { id: &#x27;grill-with-docs&#x27;, stage: &#x27;clarify&#x27;, use: &#x27;一边追问设计，一边把确定下来的术语和决策写进文档，防止以后忘掉。&#x27;, connections: [&#x27;grilling&#x27;, &#x27;to-spec&#x27;] },
      { id: &#x27;to-questionnaire&#x27;, stage: &#x27;clarify&#x27;, use: &#x27;把要问别人的一堆问题，整理成一份清楚的问卷。&#x27;, connections: [&#x27;to-spec&#x27;] },
      { id: &#x27;research&#x27;, stage: &#x27;clarify&#x27;, use: &#x27;帮你查资料，看官方文档和可靠来源，然后写成一份调研笔记。&#x27;, connections: [&#x27;to-spec&#x27;] },
      { id: &#x27;prototype&#x27;, stage: &#x27;clarify&#x27;, use: &#x27;先快速做一个能试的小样，验证想法行不行，做完可以扔掉。&#x27;, connections: [&#x27;grill-with-docs&#x27;] },
      { id: &#x27;to-spec&#x27;, stage: &#x27;specify&#x27;, use: &#x27;把大家聊过的内容和代码库里的情况，整理成一份“可以照着干活”的技术说明。&#x27;, connections: [&#x27;to-tickets&#x27;, &#x27;implement&#x27;] },
      { id: &#x27;to-tickets&#x27;, stage: &#x27;specify&#x27;, use: &#x27;把一份大方案拆成一条条有先后顺序的小任务。&#x27;, connections: [&#x27;implement&#x27;, &#x27;implement-spec&#x27;] },
      { id: &#x27;wayfinder&#x27;, stage: &#x27;specify&#x27;, use: &#x27;给一个很大的项目画地图，记录已经决定什么、卡在哪里、下一步做什么。&#x27;, connections: [&#x27;to-spec&#x27;] },
      { id: &#x27;workflow-designer&#x27;, stage: &#x27;specify&#x27;, use: &#x27;把经常重复做的工作流程，写成一套明确步骤，让以后照着执行。&#x27;, connections: [&#x27;to-spec&#x27;] },
      { id: &#x27;goal&#x27;, stage: &#x27;specify&#x27;, use: &#x27;帮你写一个让 AI 长时间自主干活的清晰目标和完成标准。&#x27;, connections: [&#x27;implement-spec&#x27;] },
      { id: &#x27;setup-engineering-workflows&#x27;, stage: &#x27;specify&#x27;, use: &#x27;帮项目设置 issue 规则、标签和文档结构，让以后工作有章可循。&#x27;, connections: [&#x27;triage&#x27;] },
      { id: &#x27;engineering-workflow-guide&#x27;, stage: &#x27;specify&#x27;, use: &#x27;像一个前台接待员，判断你的任务该交给哪个专门的技能去做。&#x27;, connections: [&#x27;to-spec&#x27;, &#x27;implement&#x27;, &#x27;diagnosing-bugs&#x27;, &#x27;improve-codebase-architecture&#x27;, &#x27;ai-engineering&#x27;, &#x27;goal&#x27;, &#x27;handoff&#x27;, &#x27;skill-conductor&#x27;] },

      { id: &#x27;tdd&#x27;, stage: &#x27;build&#x27;, use: &#x27;先写测试，再写代码，让功能一步一步被测试逼着实现出来。&#x27;, connections: [&#x27;code-review&#x27;] },

      { id: &#x27;migrate-to-shoehorn&#x27;, stage: &#x27;build&#x27;, use: &#x27;把测试里危险的全量类型断言改成更安全、更明确的写法。&#x27;, connections: [&#x27;code-review&#x27;] },

      { id: &#x27;code-review&#x27;, stage: &#x27;verify&#x27;, use: &#x27;像一个严格但不啰嗦的同事，帮你检查代码有没有 bug、是否偏离需求。&#x27;, connections: [] },
      { id: &#x27;resolving-merge-conflicts&#x27;, stage: &#x27;verify&#x27;, use: &#x27;多人改了同一个地方时，帮你把冲突代码合并成正确结果。&#x27;, connections: [&#x27;code-review&#x27;] },

    function heatColor(skillId) {
      const ratio = maxRelationships === 0 ? 0 : relationshipCounts.get(skillId) / maxRelationships;
      const intensity = 0.18 + ratio * 0.82;
      return `color-mix(in oklab, var(--red) ${intensity * 100}%, transparent)`;
    }

    function relatedLinks(skill) {
      return [
        ...skill.connections.map(target =&gt; ({
          target,
          key: `${skill.id}-&gt;${target}`
        })),
        ...skills
          .filter(other =&gt; other.connections.includes(skill.id))
          .map(other =&gt; ({
            target: other.id,
            key: `${other.id}-&gt;${skill.id}`
          }))
      ];
    }

    function createNode(skill) {
      const button = document.createElement(&#x27;button&#x27;);
      button.type = &#x27;button&#x27;;
      button.className = &#x27;btn viz-tile flow-node&#x27;;
      button.dataset.stage = skill.stage;
      button.dataset.skill = skill.id;
      button.dataset.relationships = relationshipCounts.get(skill.id);
      button.setAttribute(&#x27;aria-pressed&#x27;, String(skill.id === selectedSkillId));
      button.style.setProperty(&#x27;--tile-category&#x27;, heatColor(skill.id));
      button.textContent = skill.id;
      button.addEventListener(&#x27;click&#x27;, () =&gt; {
        selectedSkillId = skill.id;
        updateSelection();
      });
      return button;
    }

    function createStage(stage, container) {
      const section = document.createElement(&#x27;section&#x27;);
      section.className = &#x27;flow-stage&#x27;;
      section.dataset.stage = stage.id;

      const heading = document.createElement(&#x27;h3&#x27;);
      heading.className = &#x27;flow-stage-title&#x27;;
      heading.textContent = stage.label;
      section.appendChild(heading);

      skills.filter(skill =&gt; skill.stage === stage.id).forEach(skill =&gt; {
        section.appendChild(createNode(skill));
      });

      container.appendChild(section);
    }

    function updateSelection() {
      selectedSkill = skillById.get(selectedSkillId);
      selectedTitle.textContent = selectedSkill.id;
      selectedUse.textContent = selectedSkill.use;
      selectedConnections.replaceChildren();

      const links = relatedLinks(selectedSkill);

      if (links.length === 0) {
        const empty = document.createElement(&#x27;span&#x27;);
        empty.className = &#x27;flow-connection&#x27;;
        empty.textContent = &#x27;没有直接关联&#x27;;
        selectedConnections.appendChild(empty);
      } else {
        links.forEach(link =&gt; {
          const item = document.createElement(&#x27;span&#x27;);
          item.className = &#x27;flow-connection&#x27;;
          const label = document.createElement(&#x27;strong&#x27;);
          label.textContent = link.target;
          item.appendChild(label);
          item.appendChild(document.createTextNode(`：${relationshipDescriptions.get(link.key) ?? &#x27;存在直接协作关系。&#x27;}`));
          selectedConnections.appendChild(item);
        });
      }

      graph.querySelectorAll(&#x27;.flow-node&#x27;).forEach(node =&gt; {
        const isRelated = node.dataset.skill === selectedSkillId ||
          selectedSkill.connections.includes(node.dataset.skill) ||
          skillById.get(node.dataset.skill).connections.includes(selectedSkillId);
        node.setAttribute(&#x27;aria-pressed&#x27;, String(node.dataset.skill === selectedSkillId));
        node.classList.toggle(&#x27;is-dimmed&#x27;, !isRelated);
      });

      requestAnimationFrame(drawEdges);
    }

    function drawEdges() {
      let svg = graph.querySelector(&#x27;.flow-edges-svg&#x27;);
      if (!svg) {
        svg = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;svg&#x27;);
        svg.setAttribute(&#x27;class&#x27;, &#x27;flow-edges-svg&#x27;);
        svg.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
        graph.prepend(svg);
      }

      const rect = graph.getBoundingClientRect();
      svg.setAttribute(&#x27;width&#x27;, rect.width);
      svg.setAttribute(&#x27;height&#x27;, rect.height);
      svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${rect.width} ${rect.height}`);

      while (svg.firstChild) {
        svg.removeChild(svg.firstChild);
      }

      const selectedNode = graph.querySelector(`.flow-node[data-skill=&quot;${selectedSkillId}&quot;]`);
      if (!selectedNode) return;

      const selectedRect = selectedNode.getBoundingClientRect();
      const selectedCenter = {
        x: selectedRect.left + selectedRect.width / 2 - rect.left,
        y: selectedRect.top + selectedRect.height / 2 - rect.top
      };

      relatedLinks(skillById.get(selectedSkillId)).forEach(link =&gt; {
        const targetNode = graph.querySelector(`.flow-node[data-skill=&quot;${link.target}&quot;]`);
        if (!targetNode) return;

        const targetRect = targetNode.getBoundingClientRect();
        const targetCenter = {
          x: targetRect.left + targetRect.width / 2 - rect.left,
          y: targetRect.top + targetRect.height / 2 - rect.top
        };

        const isOutgoing = selectedSkill.connections.includes(link.target);
        const sourceCenter = isOutgoing ? selectedCenter : targetCenter;
        const destinationCenter = isOutgoing ? targetCenter : selectedCenter;

        const path = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;path&#x27;);
        const midX = (selectedCenter.x + targetCenter.x) / 2;
        const controlY = Math.min(selectedCenter.y, targetCenter.y) - 18;
        path.setAttribute(&#x27;d&#x27;, `M ${sourceCenter.x} ${sourceCenter.y} Q ${midX} ${controlY} ${destinationCenter.x} ${destinationCenter.y}`);
        path.setAttribute(&#x27;class&#x27;, &#x27;flow-edge&#x27;);
        svg.appendChild(path);

      });
    }

    stages.forEach(stage =&gt; createStage(stage, graph));

    updateSelection();

    requestAnimationFrame(() =&gt; requestAnimationFrame(drawEdges));

    window.addEventListener(&#x27;resize&#x27;, () =&gt; requestAnimationFrame(drawEdges));
    setTimeout(() =&gt; drawEdges(), 120);
    setTimeout(() =&gt; drawEdges(), 400);

&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;

    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

    target?.nodeType === Node.ELEMENT_NODE

  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

        .split(/\s+/)

    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {

    activeTrigger = null;
    tooltip?.remove();

        flip({ padding: tooltipGap }),

    setDescribedBy(trigger, true);

  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0

      openTooltip(trigger);

    openTimeout = window.setTimeout(() =&gt; {

      pendingTrigger = null;
      openTooltip(trigger);

  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);

  document.addEventListener(&quot;pointerout&quot;, handleLeave);

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
